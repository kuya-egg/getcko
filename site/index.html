<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
    <title>GetcKo · Ask out loud. GetcKo points.</title>
    <meta name="description" content="GetcKo is a private desktop helper that works offline. Ask out loud: GetcKo points at the right thing on your screen and cites your own documents. Nothing leaves your computer." />
    <link rel="canonical" href="https://getcko.vercel.app/" />
    <!-- Open Graph / social card: public/og.png (1200 × 630), rendered from og.html with the real brand pieces. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GetcKo" />
    <meta property="og:url" content="https://getcko.vercel.app/" />
    <meta property="og:title" content="GetcKo · Ask out loud. GetcKo points." />
    <meta property="og:description" content="A private desktop helper that works offline. GetcKo points at the right thing on your screen and cites your own documents. Nothing leaves your computer." />
    <meta property="og:image" content="https://getcko.vercel.app/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="GetcKo, a green pixel gecko, points at the Upload ID button on a business permit form. Ask out loud. GetcKo points." />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GetcKo · Ask out loud. GetcKo points." />
    <meta name="twitter:description" content="A private desktop helper that works offline. Nothing leaves your computer." />
    <meta name="twitter:image" content="https://getcko.vercel.app/og.png" />
    <meta name="twitter:image:alt" content="GetcKo, a green pixel gecko, points at the Upload ID button on a business permit form." />
    <!-- Light only: the page ignores the OS dark preference (data-theme="light" on <html>). -->
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#FFFFFF" />
    <script>
      // Decide before first paint whether the logo intro plays (once per session; ?intro forces it).
      try {
        var force = /[?&]intro\b/.test(location.search);
        var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
        if (!reduce && (force || !sessionStorage.getItem("gc-intro"))) document.documentElement.classList.add("intro-pending");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
