<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
    <title>GetcKo · Where do I click? Just ask.</title>
    <meta name="description" content="Ask out loud in any app: GetcKo points at the button and tells you why, from your own documents. A private desktop helper that works offline. Nothing leaves your computer." />
    <link rel="canonical" href="https://getcko.vercel.app/" />
    <!-- Open Graph / social card: public/og.png (1200 × 630), rendered from og.html with the real brand pieces.
         Facebook, X, LinkedIn and chat apps cache the image by URL: bump ?v= on og:image and twitter:image after every re-capture. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GetcKo" />
    <meta property="og:url" content="https://getcko.vercel.app/" />
    <meta property="og:title" content="GetcKo · Where do I click? Just ask." />
    <meta property="og:description" content="GetcKo points at the button and tells you why, from your own documents. A private desktop helper that works offline. Nothing leaves your computer." />
    <meta property="og:image" content="https://getcko.vercel.app/og.png?v=2" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="GetcKo, a green pixel gecko, points at the Upload ID button on a business permit form. Where do I click? Just ask." />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GetcKo · Where do I click? Just ask." />
    <meta name="twitter:description" content="GetcKo points at the button and tells you why. Works offline. Nothing leaves your computer." />
    <meta name="twitter:image" content="https://getcko.vercel.app/og.png?v=2" />
    <meta name="twitter:image:alt" content="GetcKo, a green pixel gecko, points at the Upload ID button on a business permit form. Where do I click? Just ask." />
    <!-- Light only: the page ignores the OS dark preference (data-theme="light" on <html>). -->
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#FFFFFF" />
    <script>
      // Decide before first paint whether the logo intro plays (once per session; ?intro forces it).
      try {
        var force = /[?&]intro\b/.test(location.search);
        var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
        if (!reduce && (force || !sessionStorage.getItem("gc-intro"))) document.documentElement.classList.add("intro-pending");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
