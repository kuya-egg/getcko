<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
    <title>GetcKo · Ask out loud. GetcKo points.</title>
    <meta name="description" content="GetcKo is a private desktop helper that works offline. Ask out loud: GetcKo points at the right thing on your screen and cites your own documents. Nothing leaves this Mac." />
    <!-- Light only: the page ignores the OS dark preference (data-theme="light" on <html>). -->
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#FFFFFF" />
    <script>
      // Decide before first paint whether the logo intro plays (once per session; ?intro forces it).
      try {
        var force = /[?&]intro\b/.test(location.search);
        var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
        if (!reduce && (force || !sessionStorage.getItem("gc-intro"))) document.documentElement.classList.add("intro-pending");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
