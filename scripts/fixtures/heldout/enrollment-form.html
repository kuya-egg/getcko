<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Learner Enrollment — San Isidro Elementary School</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef2f6;color:#223047;font:14px Arial,sans-serif}.top{background:#123b66;color:white;padding:16px 28px;display:flex;justify-content:space-between}.top strong{font-size:20px}.wrap{max-width:1200px;margin:20px auto;background:white;padding:22px 28px;border-radius:10px;box-shadow:0 3px 14px #19385818}h1{font-size:21px;margin:0 0 4px}p{color:#66768a;margin:4px 0 15px}.section{font-weight:bold;color:#1764a0;border-bottom:1px solid #dbe4ed;padding:10px 0 6px;margin-bottom:10px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px 18px}.field{display:flex;flex-direction:column;gap:5px}.field label,.legend{font-size:12px;color:#53647a}.field input,.field select{height:34px;border:1px solid #bdc9d6;border-radius:5px;padding:6px 9px;font:inherit;background:#fff}.choices{height:34px;display:flex;align-items:center;gap:12px}.choices label{color:#37465b}input[type=radio],input[type=checkbox]{accent-color:#1764a0}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:17px}button{border:0;border-radius:5px;padding:9px 17px;font-weight:bold}button[type=reset]{background:#e6ebf1;color:#35465b}button[type=submit]{background:#1764a0;color:white}
</style></head><body><header class="top"><strong>DepEd Learner Information System</strong><span>San Isidro Elementary School · SY 2026–2027</span></header><main class="wrap"><h1>Basic Education Enrollment Form</h1><p>Complete learner details for incoming Grade 4 enrolment. Fields marked with * are required.</p><form><div class="section">Learner Information</div><div class="grid">
<div class="field"><label for="lrn">Learner Reference Number (LRN)</label><input id="lrn" aria-label="Learner Reference Number (LRN)" placeholder="12-digit LRN"></div><div class="field"><label for="last">Last name *</label><input id="last" aria-label="Last name" autocomplete="family-name"></div><div class="field"><label for="first">First name *</label><input id="first" aria-label="First name" autocomplete="given-name"></div><div class="field"><label for="middle">Middle name</label><input id="middle" aria-label="Middle name"></div><div class="field"><label for="birth">Date of birth *</label><input id="birth" type="date" aria-label="Date of birth"></div><div class="field"><label for="place">Place of birth (municipality/city)</label><input id="place" aria-label="Place of birth"></div>
<div class="field"><span class="legend">Sex *</span><div class="choices"><label><input type="radio" name="sex" aria-label="Sex, Male"> Male</label><label><input type="radio" name="sex" aria-label="Sex, Female"> Female</label></div></div><div class="field"><label for="tongue">Mother tongue</label><select id="tongue" aria-label="Mother tongue"><option value="">Select language</option><option>Filipino</option><option>English</option><option>Cebuano</option><option>Ilocano</option><option>Waray</option></select></div><div class="field"><span class="legend">Learner belongs to</span><div class="choices"><label><input type="checkbox" aria-label="Indigenous Peoples community"> IP community</label><label><input type="checkbox" aria-label="4Ps beneficiary"> 4Ps</label></div></div>
</div><div class="section">Current Address</div><div class="grid"><div class="field"><label for="house">House number and street</label><input id="house" aria-label="House number and street"></div><div class="field"><label for="barangay">Barangay</label><input id="barangay" aria-label="Barangay"></div><div class="field"><label for="municipality">Municipality / City</label><input id="municipality" aria-label="Municipality or city"></div><div class="field"><label for="province">Province</label><input id="province" aria-label="Province"></div><div class="field"><label for="zip">Postal code</label><input id="zip" aria-label="Postal code"></div><div class="field"><label for="guardian">Parent / guardian full name *</label><input id="guardian" aria-label="Parent or guardian full name"></div><div class="field"><label for="phone">Guardian mobile number *</label><input id="phone" type="tel" aria-label="Guardian mobile number" placeholder="09XX XXX XXXX"></div><div class="field"><label for="email">Guardian email address</label><input id="email" type="email" aria-label="Guardian email address"></div></div><div class="actions"><button type="reset">Clear form</button><button type="submit">Submit enrollment</button></div></form></main></body></html>
