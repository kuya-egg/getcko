<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GetcKo textures</title>
<!-- Scratch preview of public/brand textures and plates. Open this file directly in a browser (file://). Lives outside public/ so it never ships in the app bundle. -->
<style>
  :root { --paper:#FFFFFF; --canvas:#F6F7F4; --line:#E6E8E3; --ink:#0E0F0C; --ink2:#4A4D46; --night:#121410; --night1:#191B16; --nline:#2E3229; --mist:#F1F3EC; --mist2:#B8BDB0; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font:14px/1.45 "Geist Variable","Geist",system-ui,sans-serif; }
  header { padding:32px 16px 8px; max-width:1240px; margin:0 auto; }
  h1 { font:600 28px/1.1 "Bricolage Grotesque Variable",system-ui,sans-serif; margin:0 0 4px; letter-spacing:-.01em; }
  p { margin:0; color:var(--ink2); }
  main { max-width:1240px; margin:0 auto; padding:16px; display:grid; gap:24px; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:0; border:1px solid var(--line); border-radius:20px; overflow:hidden; }
  .cell { min-height:240px; position:relative; }
  .cell.light { background-color:var(--paper); }
  .cell.dark { background-color:var(--night); color:var(--mist); }
  .tag { position:absolute; left:12px; bottom:12px; font:500 12px/1 "Geist Mono Variable",ui-monospace,monospace; padding:6px 8px; border-radius:7px; background:var(--paper); border:1px solid var(--line); color:var(--ink); }
  .dark .tag { background:var(--night1); border-color:var(--nline); color:var(--mist2); }
  .wm { background-repeat:no-repeat; background-position:center; image-rendering:pixelated; }
  .plates { display:grid; grid-template-columns:1fr; gap:16px; }
  .plates img { width:100%; height:auto; display:block; border:1px solid var(--line); border-radius:10px; }
  .pair { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  h2 { font:600 18px/1.2 "Bricolage Grotesque Variable",system-ui,sans-serif; margin:16px 0 0; }
  @media (max-width:720px){ .row,.pair{ grid-template-columns:1fr; } }
</style>
</head>
<body>
<header>
  <h1>GetcKo textures</h1>
  <p>Every tile on paper (left) and night (right). Plates below. Source: src/brand/textures.ts.</p>
</header>
<main id="tiles"></main>
<main>
  <h2>Plates, 1920 x 1080</h2>
  <div class="plates" id="plates"></div>
</main>
<script>
  const T = [
    ["grid-cell", "176px 216px", "repeat"],
    ["dither-lo", "16px 16px", "repeat"],
    ["dither-mid", "16px 16px", "repeat"],
    ["dither-fade", "16px 288px", "repeat-x"],
    ["grain", "240px 240px", "repeat"],
    ["scales", "96px 60px", "repeat"],
    ["crosshair", "96px 96px", "repeat"],
    ["watermark-solid", "176px 216px", "no-repeat"],
    ["watermark-dither", "176px 216px", "no-repeat"],
  ];
  const tiles = document.getElementById("tiles");
  for (const [n, size, rep] of T) {
    const row = document.createElement("div");
    row.className = "row";
    for (const m of ["light", "dark"]) {
      const c = document.createElement("div");
      c.className = "cell " + m + (rep === "no-repeat" ? " wm" : "");
      c.style.backgroundImage = `url(../../public/brand/textures/${n}-${m}.svg)`;
      c.style.backgroundSize = size;
      c.style.backgroundRepeat = rep;
      if (rep === "no-repeat") c.style.minHeight = "300px";
      if (n === "dither-fade") c.style.backgroundPosition = "left bottom";
      c.innerHTML = `<span class="tag">${n}-${m}</span>`;
      row.appendChild(c);
    }
    tiles.appendChild(row);
  }
  const plates = document.getElementById("plates");
  for (const p of ["point", "watermark", "headmark"]) {
    const pair = document.createElement("div");
    pair.className = "pair";
    for (const m of ["light", "dark"]) {
      const img = document.createElement("img");
      img.src = `../../public/brand/plates/plate-${p}-${m}.svg`;
      img.alt = `plate ${p} ${m}`;
      pair.appendChild(img);
    }
    plates.appendChild(pair);
  }
</script>
</body>
</html>
