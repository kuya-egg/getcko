[package]
name = "getcko"
version = "0.1.0"
description = "Private desktop copilot whose AI runs entirely on your laptop"
authors = ["GetCko team"]
license = "Apache-2.0"
edition = "2024"
rust-version = "1.88"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (cargo#8519 on Windows).
name = "getcko_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.40", features = ["bundled", "load_extension"] }
sha2 = "0.11"
ts-rs = "12"
pdf-extract = "0.12"
llama-cpp-2 = { version = "0.1.159", default-features = false }

# GPU offload with automatic CPU fallback on both OSes (see engine::llama):
# macOS → Metal (every Apple Silicon Mac); Windows → Vulkan (NVIDIA, AMD and Intel
# GPUs; needs the Vulkan SDK at build time) plus OpenMP CPU threads.
[target.'cfg(target_os = "macos")'.dependencies]
llama-cpp-2 = { version = "0.1.159", default-features = false, features = ["metal"] }

[target.'cfg(target_os = "windows")'.dependencies]
llama-cpp-2 = { version = "0.1.159", default-features = false, features = ["vulkan", "openmp"] }

[dev-dependencies]
tempfile = "3"

[profile.dev.package."*"]
# llama.cpp and sqlite are unusably slow unoptimised; our own crate stays debuggable.
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
