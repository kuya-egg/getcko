[package]
name = "getcko"
version = "0.1.0"
description = "Private desktop copilot whose AI runs entirely on your laptop"
authors = ["GetCko team"]
license = "Apache-2.0"
edition = "2024"
rust-version = "1.88"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (cargo#8519 on Windows).
name = "getcko_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.40", features = ["bundled", "load_extension"] }
sha2 = "0.11"
ts-rs = "12"
pdf-extract = "0.12"
# `mtmd`: Gemma 4 E2B's own audio + vision encoder (mmproj) for speech-to-text and
# screenshots. Used instead of whisper.cpp, whose bundled ggml clashes at link time
# with llama.cpp's (duplicate ggml symbols).
llama-cpp-2 = { version = "0.1.159", default-features = false, features = ["mtmd"] }
# Text-to-speech through OS voices; same crate on both OSes.
tts = "0.26"
# Push-to-talk capture (engine/microphone.rs), shared by both OSes.
cpal = "0.18"
# Screenshot downscaling for screen tiers 2-3 (screenshot.rs).
image = { version = "0.25", default-features = false }

# GPU offload with automatic CPU fallback on both OSes (see engine::llama):
# macOS → Metal (every Apple Silicon Mac); Windows → Vulkan (NVIDIA, AMD and Intel
# GPUs; needs the Vulkan SDK at build time) plus OpenMP CPU threads.
[target.'cfg(target_os = "macos")'.dependencies]
llama-cpp-2 = { version = "0.1.159", default-features = false, features = ["metal"] }
# Screen reading (platform/macos.rs): AX API, screens and frontmost app.
accessibility-sys = "0.2"
core-foundation = "0.10"
core-graphics = "0.25"
foreign-types = "0.5"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-av-foundation = { version = "0.3", features = ["AVCaptureDevice"] }
block2 = "0.6"
objc2-vision = { version = "0.3", features = ["VNRequest", "VNRecognizeTextRequest", "VNRequestHandler", "VNObservation", "VNTypes", "objc2-core-graphics", "objc2-core-foundation"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["CGImage", "std"] }

[target.'cfg(target_os = "windows")'.dependencies]
llama-cpp-2 = { version = "0.1.159", default-features = false, features = ["vulkan", "openmp"] }
# Screen reading and capture (platform/windows.rs): UI Automation, window list,
# per-monitor DPI, Windows.Graphics.Capture via Direct3D 11, privacy consent store.
# 0.62 is the version tao/wry already pull in.
windows = { version = "0.62", features = [
  "Foundation",
  "Graphics",
  "Graphics_Capture",
  "Graphics_DirectX",
  "Graphics_DirectX_Direct3D11",
  "Graphics_Imaging",
  "Media_Ocr",
  "Security_Cryptography",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Ole",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
# AsyncStatus for waiting on Windows.Media.Ocr with a deadline (already a dependency of `windows`).
windows-future = "0.3"

[dev-dependencies]
tempfile = "3"

[profile.dev.package."*"]
# llama.cpp and sqlite are unusably slow unoptimised; our own crate stays debuggable.
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
